<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Meus Prompts</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; background: #f2f2f7; }
    textarea { width: 100%; height: 200px; border-radius: 10px; border: none; padding: 10px; font-size: 16px; margin-bottom: 20px; }
    button { background: #007aff; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; width: 100%; font-weight: bold; }
  </style>
</head>
<body>
  <h2 style="margin-top: 40px;">Meus Códigos e Prompts</h2>
  <textarea id="promptArea" placeholder="Cole ou digite seu prompt aqui..."></textarea>
  <button onclick="copiarPrompt()">Copiar Prompt</button>

  <script>
    function copiarPrompt() {
      var copyText = document.getElementById("promptArea");
      copyText.select();
      document.execCommand("copy");
      alert("Prompt copiado!");
    }
  </script>
</body>
</html>
